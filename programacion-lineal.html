<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Programación lineal · 2.º Bach CCSS · Mercedes Cerezo</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://cerezillamates.github.io/2bach-ccss/programacion-lineal/">
<script>
/* La página de Programación lineal se ha pasado al formato nuevo. Esta dirección se mantiene
   para que sigan funcionando los enlaces guardados: cada parte va a su sitio nuevo. */
(function(){
  var h = location.hash.slice(1), b = "2bach-ccss/programacion-lineal/", d = b;
  var m = h.match(/^e(\d+)$/);
  if (m) d = b + "selectividad.html#e" + m[1];
  else if (h === "tabla") d = b + "selectividad.html#tabla";
  else if (h === "ejercicios") d = b + "selectividad.html#lista";
  else if (h === "teoria") d = b + "metodo.html";
  else if (h === "tipos") d = b + "problemas-tipo.html";
  else if (/^q\d+$/.test(h)) d = b + "problemas-tipo.html";
  else if (h.indexOf("repaso") === 0) d = b + "repaso.html";
  location.replace(d);
})();
</script>
</head>
<body>
<p>Programación lineal está ahora en <a href="2bach-ccss/programacion-lineal/">su página nueva</a>: el método, los problemas tipo, los ejercicios de selectividad y el repaso.</p>
</body>
